[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flroad"
version = "0.1.0"
description = "Federated learning simulator for vehicular networks"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pyyaml",
    "pydantic",
    "typer",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
flroad = "flroad.cli:app"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I"]
